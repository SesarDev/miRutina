<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="miRutina" />
    <meta name="description" content="Registro personal de entrenamiento de fuerza." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1626" />
    <title>miRutina</title>
    <script>
      // Apply the stored theme before first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem('mirutina:theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <style>
      html { background: #0c1626; }
      @media (prefers-color-scheme: light) { html:not([data-theme='dark']) { background: #f3eee3; } }
      html[data-theme='light'] { background: #f3eee3; }
      .boot {
        display: grid; place-items: center; min-height: 100dvh; margin: 0;
        color: #f3eee3; font: 700 2rem/1 'Barlow Condensed', system-ui, sans-serif; letter-spacing: 0.01em;
      }
      .boot span { color: #e9af41; }
      @media (prefers-color-scheme: light) { html:not([data-theme='dark']) .boot { color: #0c1626; } }
      html[data-theme='light'] .boot { color: #0c1626; }
    </style>
  </head>
  <body>
    <!-- Painted before the JavaScript arrives; React replaces it on its first render. -->
    <div id="root">
      <div class="boot" aria-hidden="true">mi<span>Rutina</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
